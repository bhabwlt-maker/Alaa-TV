<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قناة علاء | Alaa TV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Alaa<span>TV</span></div>
        <nav>
            <a href="#" class="active">الرئيسية</a>
            <a href="#">أفلام</a>
            <a href="#">مسلسلات</a>
            <a href="#">مباريات</a>
        </nav>
        <div class="user-actions">
            <button class="login-btn">تسجيل الدخول</button>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>مرحباً بك في قناة علاء</h1>
            <p>استمتع بأفضل الأفلام والمسلسلات في مكان واحد.</p>
            <button class="play-btn" onclick="alert('سيتم إضافة الفيديوهات قريباً!')">▶ شاهد الآن</button>
        </div>
    </section>

    <main>
        <section class="content-section">
            <h2>أحدث الإضافات</h2>
            <div class="movie-grid" id="movieGrid"></div>
        </section>

        <!-- نافذة تشغيل الفيديو -->
        <div id="videoModal" class="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeVideo()">&times;</span>
                <video id="mainVideo" controls>
                    <source src="" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
